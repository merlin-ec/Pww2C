<h2>Reset your Prestige World Wide password</h2>
<p>Tap the button to choose a new password.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
     style="display:inline-block;padding:12px 20px;background:#cfa45a;color:#1b0e11;border-radius:6px;font-weight:600;text-decoration:none">
    Choose a new password
  </a>
</p>
<p>The link works once and expires in an hour. If you didn't ask to reset your password, you can ignore this email; your password hasn't changed.</p>
