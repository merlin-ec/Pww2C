<h2>Confirm your Prestige World Wide account</h2>
<p>Tap the button to confirm this email address and finish creating your account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/account"
     style="display:inline-block;padding:12px 20px;background:#cfa45a;color:#1b0e11;border-radius:6px;font-weight:600;text-decoration:none">
    Confirm my email
  </a>
</p>
<p>The link works once and expires in 24 hours. If you didn't sign up for PWW, ignore this email.</p>
